<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>MituFunの记账本</title>
  <link rel="icon" href="https://blog.mitufun.top/favicon/avatar.png" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
    body { background: #f5f7fb; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .app-container { max-width: 600px; width: 100%; background: white; border-radius: 32px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 8px 20px rgba(0, 0, 0, 0.04); padding: 28px 22px; transition: 0.2s; }
    h1 { font-size: 26px; font-weight: 600; color: #0b1b32; display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
    h1 i { color: #3b7cff; font-size: 24px; }
    .subhead { color: #6b7a8f; font-size: 14px; font-weight: 400; margin-bottom: 24px; border-left: 3px solid #3b7cff; padding-left: 12px; background: #f0f4fe; border-radius: 0 12px 12px 0; line-height: 1.4; }
    .balance-card { background: linear-gradient(135deg, #1a2a4a, #0f1a30); color: white; border-radius: 24px; padding: 22px 20px; margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 16px rgba(0,20,50,0.12); }
    .balance-label { font-size: 14px; opacity: 0.7; letter-spacing: 0.5px; font-weight: 300; }
    .balance-number { font-size: 38px; font-weight: 600; letter-spacing: -0.5px; margin-top: 4px; }
    .balance-number small { font-size: 20px; font-weight: 400; opacity: 0.6; margin-left: 4px; }
    .reset-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: white; padding: 8px 14px; border-radius: 40px; font-size: 13px; cursor: pointer; transition: 0.2s; backdrop-filter: blur(2px); display: flex; align-items: center; gap: 6px; }
    .reset-btn:hover { background: rgba(255,70,70,0.25); border-color: #ff7a7a; }
    .reset-btn i { font-size: 13px; }
    .form-section { background: #f8faff; padding: 18px 16px; border-radius: 20px; margin-bottom: 28px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.02); }
    .input-group { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .input-group input, .input-group select { flex: 1 0 100px; padding: 12px 14px; border: 1px solid #e3e9f2; border-radius: 16px; background: white; font-size: 15px; transition: 0.2s; outline: none; color: #0b1b32; }
    .input-group input:focus, .input-group select:focus { border-color: #3b7cff; box-shadow: 0 0 0 3px rgba(59, 124, 255, 0.15); }
    .input-group input::placeholder { color: #a0b3cc; }
    .type-selector { display: flex; gap: 6px; flex: 1 0 120px; }
    .type-btn { flex: 1; padding: 10px 0; border: 1px solid #e3e9f2; background: white; border-radius: 30px; font-weight: 500; font-size: 14px; color: #4a5b74; cursor: pointer; transition: 0.15s; text-align: center; }
    .type-btn.active-income { background: #e3f3e9; border-color: #1f9d6a; color: #0f7a4e; }
    .type-btn.active-expense { background: #ffe9ed; border-color: #e65c6b; color: #b93a4a; }
    .type-btn i { margin-right: 4px; }
    .add-btn { background: #3b7cff; border: none; color: white; padding: 12px 22px; border-radius: 40px; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 8px rgba(59, 124, 255, 0.25); flex: 1 0 100%; justify-content: center; border: 1px solid rgba(255,255,255,0.1); }
    .add-btn:hover { background: #2b66e0; transform: scale(0.98); }
    .add-btn:active { transform: scale(0.95); }
    .transaction-list { margin-top: 10px; }
    .list-header { display: flex; justify-content: space-between; color: #6b7a8f; font-size: 13px; font-weight: 500; letter-spacing: 0.3px; padding: 0 4px 8px 4px; border-bottom: 1px solid #edf2f9; }
    .list-items { list-style: none; margin-top: 6px; max-height: 500px; overflow-y: auto; padding-right: 4px; }
    .list-items::-webkit-scrollbar { width: 4px; }
    .list-items::-webkit-scrollbar-track { background: #eef2f7; border-radius: 10px; }
    .list-items::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .transaction-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 12px; background: white; border-radius: 16px; margin-bottom: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.02); border: 1px solid #f0f4fe; transition: 0.1s; animation: fadeIn 0.2s ease; }
    .transaction-item:hover { border-color: #d6e2ff; }
    .tx-left { display: flex; align-items: center; gap: 12px; flex: 2; }
    .tx-icon { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 16px; flex-shrink: 0; }
    .tx-icon.income { background: #1f9d6a; }
    .tx-icon.expense { background: #e65c6b; }
    .tx-desc { font-weight: 500; color: #0b1b32; word-break: break-word; flex: 1; }
    .tx-amount { font-weight: 600; font-size: 16px; margin-right: 8px; flex-shrink: 0; }
    .tx-amount.income { color: #1f9d6a; }
    .tx-amount.expense { color: #e65c6b; }
    .tx-date { font-size: 12px; color: #8e9fb1; background: #f0f4fc; padding: 2px 10px; border-radius: 40px; white-space: nowrap; flex-shrink: 0; }
    .tx-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .more-btn { background: transparent; border: none; color: #bcc9db; cursor: pointer; font-size: 18px; padding: 4px 6px; border-radius: 30px; transition: 0.15s; }
    .more-btn:hover { color: #3b7cff; background: #f0f4fe; }
    .delete-btn { background: transparent; border: none; color: #bcc9db; cursor: pointer; font-size: 16px; padding: 6px 8px; border-radius: 30px; transition: 0.15s; }
    .delete-btn:hover { color: #d14c5c; background: #fff0f2; }
    .empty-state { text-align: center; padding: 40px 10px; color: #8e9fb1; }
    .empty-state i { font-size: 40px; opacity: 0.3; margin-bottom: 12px; }
    .status-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; font-size: 13px; color: #6b7a8f; border-top: 1px solid #edf2f9; padding-top: 16px; }
    .redis-badge { background: #eef2f7; padding: 4px 12px; border-radius: 40px; font-weight: 400; display: inline-flex; align-items: center; gap: 6px; }
    .redis-badge i { color: #d93c3c; }
    .load-more-btn { width: 100%; padding: 12px; background: #f8faff; border: 1px dashed #d6e2ff; border-radius: 16px; color: #3b7cff; font-size: 14px; font-weight: 500; cursor: pointer; transition: 0.2s; margin-top: 8px; }
    .load-more-btn:hover { background: #f0f4fe; border-color: #3b7cff; }
    .load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

    .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 27, 50, 0.85); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
    .login-box { background: white; border-radius: 32px; padding: 40px 32px; max-width: 400px; width: 100%; box-shadow: 0 24px 48px rgba(0,0,0,0.3); text-align: center; }
    .login-box .lock-icon { font-size: 48px; color: #3b7cff; margin-bottom: 12px; }
    .login-box h2 { color: #0b1b32; font-size: 22px; margin-bottom: 6px; }
    .login-box p { color: #6b7a8f; font-size: 14px; margin-bottom: 24px; }
    .login-box input { width: 100%; padding: 14px 16px; border: 2px solid #e3e9f2; border-radius: 16px; font-size: 16px; outline: none; transition: 0.2s; margin-bottom: 16px; text-align: center; letter-spacing: 2px; }
    .login-box input:focus { border-color: #3b7cff; box-shadow: 0 0 0 4px rgba(59, 124, 255, 0.12); }
    .login-box .login-btn { width: 100%; padding: 14px; background: #3b7cff; color: white; border: none; border-radius: 16px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .login-box .login-btn:hover { background: #2b66e0; transform: scale(0.98); }
    .login-box .login-error { color: #e65c6b; font-size: 13px; margin-top: 8px; min-height: 20px; }

    .detail-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; animation: fadeIn 0.2s ease; }
    .detail-modal .modal-content { background: white; border-radius: 24px; padding: 32px 28px; max-width: 400px; width: 100%; box-shadow: 0 24px 48px rgba(0,0,0,0.2); position: relative; }
    .detail-modal .close-modal { position: absolute; top: 16px; right: 20px; background: none; border: none; font-size: 24px; color: #bcc9db; cursor: pointer; transition: 0.15s; }
    .detail-modal .close-modal:hover { color: #0b1b32; }
    .detail-modal .detail-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f0f4fe; }
    .detail-modal .detail-item:last-child { border-bottom: none; }
    .detail-modal .detail-label { color: #6b7a8f; font-size: 14px; }
    .detail-modal .detail-value { color: #0b1b32; font-weight: 500; font-size: 14px; text-align: right; }

    @media (max-width: 480px) {
      .app-container { padding: 20px 14px; }
      .balance-number { font-size: 30px; }
      .input-group input, .input-group select { padding: 10px 12px; }
      .login-box { padding: 28px 20px; }
      .detail-modal .modal-content { padding: 24px 18px; }
    }
  </style>
</head>
<body>

<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="lock-icon"><i class="fas fa-lock"></i></div>
    <h2>🔐 请输入密码</h2>
    <p>此记账本已加密，请输入访问密码</p>
    <input type="password" id="passwordInput" placeholder="请输入密码" maxlength="20" />
    <button class="login-btn" id="loginBtn"><i class="fas fa-unlock-alt"></i> 解锁</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="app-container" id="appContainer" style="display:none;">
  <h1><i class="fas fa-wallet"></i> 记账本</h1>
  <div class="subhead"><i class="fas fa-database" style="margin-right: 6px; color:#3b7cff;"></i> 已连接 Upstash Redis (加密存储)</div>

  <div class="balance-card">
    <div>
      <div class="balance-label"><i class="fas fa-coins"></i> 当前余额</div>
      <div class="balance-number" id="balanceDisplay">0.00 <small>¥</small></div>
    </div>
    <button class="reset-btn" id="resetDataBtn" title="清空所有记录 (不可撤销)">
      <i class="fas fa-trash-alt"></i> 重置
    </button>
  </div>

  <div class="form-section">
    <div class="input-group">
      <input type="text" id="descInput" placeholder="描述 (如: 午餐)" maxlength="40" />
      <input type="number" id="amountInput" placeholder="金额" min="0.01" step="0.01" />
      <div class="type-selector">
        <button class="type-btn active-income" id="typeIncomeBtn"><i class="fas fa-arrow-up"></i> 收入</button>
        <button class="type-btn" id="typeExpenseBtn"><i class="fas fa-arrow-down"></i> 支出</button>
      </div>
      <button class="add-btn" id="addBtn"><i class="fas fa-plus-circle"></i> 添加记录</button>
    </div>
  </div>

  <div class="transaction-list">
    <div class="list-header">
      <span><i class="far fa-clock"></i> 近期流水</span>
      <span id="recordCount">0 笔</span>
    </div>
    <ul class="list-items" id="transactionList">
      <div class="empty-state" id="emptyState">
        <i class="fas fa-receipt"></i>
        <p style="margin-top: 6px;">还没有记账记录<br><span style="font-size:13px; opacity:0.6;">添加一笔开始吧</span></p>
      </div>
    </ul>
    <button class="load-more-btn" id="loadMoreBtn" style="display:none;">
      <i class="fas fa-chevron-down"></i> 加载更多
    </button>
  </div>

  <div class="status-bar">
    <span id="syncStatus"><i class="fas fa-circle" style="color: #1f9d6a; font-size: 10px;"></i> 已同步</span>
    <span class="redis-badge"><i class="fas fa-server"></i> Upstash Redis</span>
  </div>
</div>

<div class="detail-modal" id="detailModal" style="display:none;">
  <div class="modal-content">
    <button class="close-modal" id="closeModalBtn"><i class="fas fa-times"></i></button>
    <h3 style="margin-bottom: 16px; color: #0b1b32; font-size: 18px;">
      <i class="fas fa-info-circle" style="color: #3b7cff;"></i> 账单详情
    </h3>
    <div id="detailContent">
      <div class="detail-item"><span class="detail-label">描述</span><span class="detail-value" id="detailDesc">-</span></div>
      <div class="detail-item"><span class="detail-label">类型</span><span class="detail-value" id="detailType">-</span></div>
      <div class="detail-item"><span class="detail-label">金额</span><span class="detail-value" id="detailAmount">-</span></div>
      <div class="detail-item"><span class="detail-label">添加时间</span><span class="detail-value" id="detailTime">-</span></div>
      <div class="detail-item"><span class="detail-label">记录ID</span><span class="detail-value" id="detailId" style="font-size:12px; color:#8e9fb1;">-</span></div>
    </div>
  </div>
</div>

<script>
  (function() {
    "use strict";

    const API_BASE = '/api/transactions';
    const PAGE_SIZE = 5;

    const loginOverlay = document.getElementById('loginOverlay');
    const appContainer = document.getElementById('appContainer');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');

    const balanceEl = document.getElementById('balanceDisplay');
    const listEl = document.getElementById('transactionList');
    const emptyState = document.getElementById('emptyState');
    const recordCount = document.getElementById('recordCount');
    const descInput = document.getElementById('descInput');
    const amountInput = document.getElementById('amountInput');
    const addBtn = document.getElementById('addBtn');
    const resetBtn = document.getElementById('resetDataBtn');
    const typeIncomeBtn = document.getElementById('typeIncomeBtn');
    const typeExpenseBtn = document.getElementById('typeExpenseBtn');
    const syncStatus = document.getElementById('syncStatus');
    const loadMoreBtn = document.getElementById('loadMoreBtn');

    const detailModal = document.getElementById('detailModal');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const detailDesc = document.getElementById('detailDesc');
    const detailType = document.getElementById('detailType');
    const detailAmount = document.getElementById('detailAmount');
    const detailTime = document.getElementById('detailTime');
    const detailId = document.getElementById('detailId');

    let sessionPassword = '';
    let currentType = 'income';
    let transactions = [];
    let displayCount = PAGE_SIZE;
    let currentDetailTx = null;

    function formatDate(ts) {
      const d = new Date(ts);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }

    function formatDateTime(ts) {
      const d = new Date(ts);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}:${String(d.getSeconds()).padStart(2,'0')}`;
    }

    function formatAmount(amount) {
      return Number(amount).toFixed(2);
    }

    function escapeHtml(text) {
      if (!text) return '';
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, function(m) { return map[m]; });
    }

    function setActiveType(type) {
      currentType = type;
      typeIncomeBtn.classList.remove('active-income', 'active-expense');
      typeExpenseBtn.classList.remove('active-income', 'active-expense');
      if (type === 'income') {
        typeIncomeBtn.classList.add('active-income');
      } else {
        typeExpenseBtn.classList.add('active-expense');
      }
    }

    function setSyncStatus(status, msg) {
      if (status === 'loading') {
        syncStatus.innerHTML = '<i class="fas fa-spinner fa-spin" style="color:#3b7cff;"></i> 同步中...';
      } else if (status === 'success') {
        syncStatus.innerHTML = '<i class="fas fa-circle" style="color:#1f9d6a; font-size:10px;"></i> 已同步';
      } else if (status === 'error') {
        syncStatus.innerHTML = `<i class="fas fa-exclamation-triangle" style="color:#e65c6b;"></i> ${msg || '同步异常'}`;
      }
    }

    function renderUI() {
      let balance = 0;
      transactions.forEach(tx => {
        if (tx.type === 'income') balance += Number(tx.amount);
        else balance -= Number(tx.amount);
      });
      balanceEl.innerHTML = `${formatAmount(balance)} <small>¥</small>`;

      const sorted = [...transactions].sort((a, b) => b.createdAt - a.createdAt);
      const total = sorted.length;
      const showCount = Math.min(displayCount, total);
      const showList = sorted.slice(0, showCount);

      listEl.innerHTML = '';
      if (total === 0) {
        listEl.appendChild(emptyState);
        recordCount.textContent = '0 笔';
        loadMoreBtn.style.display = 'none';
        return;
      }

      showList.forEach((tx, index) => {
        const li = document.createElement('li');
        li.className = 'transaction-item';
        const isIncome = tx.type === 'income';
        const iconClass = isIncome ? 'income' : 'expense';
        const iconSymbol = isIncome ? 'fa-arrow-up' : 'fa-arrow-down';
        const amountClass = isIncome ? 'income' : 'expense';
        const sign = isIncome ? '+' : '-';

        li.innerHTML = `
          <div class="tx-left">
            <div class="tx-icon ${iconClass}"><i class="fas ${iconSymbol}"></i></div>
            <span class="tx-desc">${escapeHtml(tx.description || '无描述')}</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px; flex-shrink:0;">
            <span class="tx-amount ${amountClass}">${sign}${formatAmount(tx.amount)}</span>
            <span class="tx-date">${formatDate(tx.createdAt)}</span>
            <div class="tx-actions">
              <button class="more-btn" data-id="${tx.id || index}" title="查看详情"><i class="fas fa-ellipsis-v"></i></button>
              <button class="delete-btn" data-id="${tx.id || index}" title="删除"><i class="fas fa-times"></i></button>
            </div>
          </div>
        `;
        listEl.appendChild(li);
      });

      recordCount.textContent = `${total} 笔`;

      if (showCount < total) {
        loadMoreBtn.style.display = 'block';
        loadMoreBtn.innerHTML = `<i class="fas fa-chevron-down"></i> 加载更多 (${showCount}/${total})`;
        loadMoreBtn.disabled = false;
      } else {
        loadMoreBtn.style.display = 'none';
      }

      listEl.querySelectorAll('.more-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const id = this.getAttribute('data-id');
          showDetail(id);
        });
      });

      listEl.querySelectorAll('.delete-btn').forEach(btn => {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          const id = this.getAttribute('data-id');
          deleteTransaction(id);
        });
      });
    }

    function showDetail(id) {
      const tx = transactions.find(t => t.id === id);
      if (!tx) {
        alert('找不到该记录');
        return;
      }
      currentDetailTx = tx;
      detailDesc.textContent = tx.description || '无描述';
      detailType.textContent = tx.type === 'income' ? '💰 收入' : '💸 支出';
      detailAmount.textContent = (tx.type === 'income' ? '+' : '-') + formatAmount(tx.amount) + ' ¥';
      detailTime.textContent = formatDateTime(tx.createdAt);
      detailId.textContent = tx.id || '无';
      detailModal.style.display = 'flex';
    }

    function closeDetail() {
      detailModal.style.display = 'none';
      currentDetailTx = null;
    }

    async function fetchTransactions() {
      try {
        setSyncStatus('loading');
        const res = await fetch(API_BASE, {
          headers: { 'X-Password': sessionPassword }
        });
        if (!res.ok) {
          let errorMsg = `HTTP ${res.status}`;
          try {
            const errorData = await res.json();
            errorMsg = errorData.error || errorMsg;
          } catch (_) {}
          if (res.status === 403) {
            sessionPassword = '';
            loginOverlay.style.display = 'flex';
            appContainer.style.display = 'none';
            loginError.textContent = '🔒 密码错误或会话过期，请重新输入';
            setSyncStatus('error', '密码错误');
            return;
          }
          throw new Error(errorMsg);
        }
        const data = await res.json();
        transactions = data.transactions || [];
        displayCount = PAGE_SIZE;
        renderUI();
        setSyncStatus('success');
      } catch (err) {
        console.error('获取数据失败:', err);
        setSyncStatus('error', err.message || '网络错误');
        transactions = [];
        renderUI();
      }
    }

    async function addTransaction(description, amount, type) {
      try {
        setSyncStatus('loading');
        const payload = { description, amount: parseFloat(amount), type };
        const res = await fetch(API_BASE, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Password': sessionPassword },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          let errorMsg = `HTTP ${res.status}`;
          try {
            const errorData = await res.json();
            errorMsg = errorData.error || errorMsg;
          } catch (_) {}
          throw new Error(errorMsg);
        }
        await fetchTransactions();
        setSyncStatus('success');
      } catch (err) {
        console.error('添加失败:', err);
        setSyncStatus('error', err.message || '添加失败');
        throw err;
      }
    }

    async function deleteTransaction(id) {
      if (!id) return;
      if (!confirm('确定要删除这条记录吗？')) return;
      try {
        setSyncStatus('loading');
        const res = await fetch(`${API_BASE}/${id}`, {
          method: 'DELETE',
          headers: { 'X-Password': sessionPassword }
        });
        if (!res.ok) {
          let errorMsg = `HTTP ${res.status}`;
          try {
            const errorData = await res.json();
            errorMsg = errorData.error || errorMsg;
          } catch (_) {}
          throw new Error(errorMsg);
        }
        await fetchTransactions();
        setSyncStatus('success');
      } catch (err) {
        console.error('删除失败:', err);
        setSyncStatus('error', err.message || '删除失败');
      }
    }

    async function resetAllData() {
      if (!confirm('⚠️ 确定要删除所有记账记录吗？此操作不可撤销！')) return;
      try {
        setSyncStatus('loading');
        const res = await fetch(API_BASE, {
          method: 'DELETE',
          headers: { 'X-Password': sessionPassword }
        });
        if (!res.ok) {
          let errorMsg = `HTTP ${res.status}`;
          try {
            const errorData = await res.json();
            errorMsg = errorData.error || errorMsg;
          } catch (_) {}
          throw new Error(errorMsg);
        }
        await fetchTransactions();
        setSyncStatus('success');
      } catch (err) {
        console.error('重置失败:', err);
        setSyncStatus('error', err.message || '重置失败');
      }
    }

    async function handleLogin() {
      const password = passwordInput.value.trim();
      if (!password) {
        loginError.textContent = '⚠️ 请输入密码';
        return;
      }

      sessionPassword = password;
      loginError.textContent = '⏳ 验证中...';
      try {
        const res = await fetch(API_BASE, {
          headers: { 'X-Password': sessionPassword }
        });
        if (res.status === 403) {
          loginError.textContent = '❌ 密码错误，请重试';
          sessionPassword = '';
          passwordInput.value = '';
          passwordInput.focus();
          return;
        }
        if (!res.ok) {
          let errorMsg = `HTTP ${res.status}`;
          try {
            const errorData = await res.json();
            errorMsg = errorData.error || errorMsg;
          } catch (_) {}
          throw new Error(errorMsg);
        }

        const data = await res.json();
        transactions = data.transactions || [];
        displayCount = PAGE_SIZE;
        renderUI();
        setSyncStatus('success');
        loginOverlay.style.display = 'none';
        appContainer.style.display = 'block';
        setActiveType('income');
        descInput.focus();
        loginError.textContent = '';
        passwordInput.value = '';
      } catch (err) {
        console.error(err);
        loginError.textContent = `❌ 连接失败: ${err.message}`;
        sessionPassword = '';
      }
    }

    loginBtn.addEventListener('click', handleLogin);
    passwordInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') handleLogin();
    });

    typeIncomeBtn.addEventListener('click', function() {
      setActiveType('income');
    });
    typeExpenseBtn.addEventListener('click', function() {
      setActiveType('expense');
    });

    addBtn.addEventListener('click', async function() {
      const desc = descInput.value.trim() || '未命名';
      const amount = parseFloat(amountInput.value);
      if (!amount || amount <= 0) {
        alert('请输入有效的金额 (大于0)');
        return;
      }
      if (desc.length > 40) {
        alert('描述不能超过40个字符');
        return;
      }
      try {
        await addTransaction(desc, amount, currentType);
        descInput.value = '';
        amountInput.value = '';
        descInput.focus();
      } catch (e) {
        alert(`添加失败: ${e.message}`);
      }
    });

    amountInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') addBtn.click();
    });
    descInput.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') amountInput.focus();
    });

    resetBtn.addEventListener('click', resetAllData);

    loadMoreBtn.addEventListener('click', function() {
      displayCount += PAGE_SIZE;
      renderUI();
    });

    closeModalBtn.addEventListener('click', closeDetail);
    detailModal.addEventListener('click', function(e) {
      if (e.target === this) closeDetail();
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && detailModal.style.display === 'flex') closeDetail();
    });

    loginOverlay.style.display = 'flex';
    appContainer.style.display = 'none';
    passwordInput.focus();

  })();
</script>
</body>
</html>
